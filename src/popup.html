<html lang="en">
<head>
<meta charset="utf-8">
<title>NADI Page Reader</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><i class="pill"><b></b><b></b></i><h1>NADI Page Reader</h1></header>
<p id="state" class="state">Checking</p>
